$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Sequoia Image Text
status: stable
description: A component that houses an image and text.
group: Organism
slots:
  video:
    title: Video Slot
    description: Optional slot for embedding a video.
  media:
    title: Media Slot
    description: Optional slot for embedding images or other media.
    examples:
      - <img src="https://placehold.co/1920x1020?text=Placeholder"/>
  links:
    type: ['string', 'null']
    title: Card Links
    description: JSON string of link data for CTA buttons.
    examples:
      - <a href="#" class="button button--primary">Button</a>
props:
  type: object
  properties:
    heading:
      type: ['string', 'null']
      control: text
      title: Lorem Ipsum
      description: Main heading of the card.
      default: 'Sunt Aliquip Nostrud'
    heading_tag:
      type: ['string', 'null']
      title: Heading Tag
      description: HTML tag for the heading (e.g., 'h2', 'h3').
      enum:
        -
        - ''
        - h2
        - h3
      default: 'h2'
    heading_id:
      type: ['string', 'null']
      control: text
      title: Heading ID
      description: Optional ID for the heading element.
      default: ''
    subhead:
      type: ['string', 'null']
      control: text
      title: Subhead Text
      description: Subheading displayed below the main heading.
      default: 'Ullamco exercitation doming.'
    description:
      type: ['string', 'null']
      control: text
      title: Description Text
      description: Rich text or plain content for the card body.
      default: 'Nulla eros tempor dignissim ex nostrud sunt ultricies sint, ultricies velit ullamco eu ullamco exercitation doming.'
    disclosure:
      type: ['string', 'null']
      control: text
      title: Disclosure Text
      description: Optional legal or disclaimer text shown in small type.
      default: 'Laboris quis duis sed amet commodo pulvinar sit ea laboris elit, harmud fugiat tempuribud velaliquam sunt aliquip pariatur.'
    background_color:
      type: ['string', 'null']
      title: Background Color
      description: Background color of the card.
      enum:
        -
        - ''
        - contrasting-crimson-red
        - contrasting-forest-green
        - contrasting-lavender-purple
        - contrasting-night-blue
        - contrasting-warm-black
        - vibrant-fresh-lime
        - vibrant-grass-green
        - vibrant-hot-pink
        - vibrant-sky-blue
        - white
      default: 'contrasting-night-blue'
    image_width:
      type: ['string', 'null', 'number']
      title: Image Width
      description: Width of the column containing the image.
      enum:
        -
        - ''
        - 3
        - 4
        - 6
        - 8
        - 9
      default: '4'
    alignment:
      type: ['string', 'null']
      title: Alignment
      description: Text alignment within the single stat component.
      enum:
        -
        - ''
        - left
        - right
      default: 'left'
    shape:
      type: ['string', 'null']
      title: Shape
      description: Shape of the image within the single stat component.
      enum:
        -
        - ''
        - arrow
        - hexagon
        - hourglass
        - octagon
        - umbrella
      default: 'hexagon'
    shape_position:
      type: ['string', 'null']
      title: Alignment
      description: Text alignment within the single stat component.
      enum:
        -
        - ''
        - bottom
        - left
        - right
        - top
      default: 'left'
    shape_color:
      type: ['string', 'null']
      title: Alignment
      description: Text alignment within the single stat component.
      enum:
        -
        - ''
        - contrasting-crimson-red
        - contrasting-forest-green
        - contrasting-lavender-purple
        - contrasting-night-blue
        - contrasting-warm-black
        - vibrant-fresh-lime
        - vibrant-grass-green
        - vibrant-hot-pink
        - vibrant-sky-blue
        - white
      default: 'contrasting-night-blue'
